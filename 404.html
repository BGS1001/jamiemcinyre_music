<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Jamie McIntyre</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .lost { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 16px;
            background: radial-gradient(90% 70% at 50% 110%, #7a3b22 0%, transparent 60%), var(--ink-2); color: var(--paper); }
    .lost h1 { font-size: clamp(56px, 12vw, 120px); font-weight: 400; }
    .lost h1 em { color: var(--rust-2); font-weight: 300; }
    .lost p { margin: 16px auto 32px; max-width: 32ch; opacity: .85; font-size: 18px; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <p class="eyebrow" style="color: var(--rust-2)">404</p>
      <h1>Lost over<br><em>Galway town</em></h1>
      <p>This page wandered off. Let’s get you back to the music.</p>
      <a class="btn btn--solid" href="./">Back home</a>
    </div>
  </main>
</body>
</html>
